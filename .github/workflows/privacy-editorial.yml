name: Privacy editorial technical validation
on:
  push:
    branches: [main]
    paths:
      - 'privacy/**'
      - 'scripts/privacy/**'
      - '.content/briefs/privacy--**'
      - '.content/reviews/privacy--**'
      - '.github/workflows/privacy-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Privacy page
        run: python scripts/privacy/validate.py
