name: Garen editorial technical validation
on:
  push:
    branches: [main]
    paths:
      - 'garen/**'
      - 'scripts/garen/**'
      - '.content/briefs/garen--**'
      - '.content/reviews/garen--**'
      - '.github/workflows/garen-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scoped Garen HTML and internal links
        env:
          GAREN_PAGE: acryl
        run: python scripts/garen/validate.py
