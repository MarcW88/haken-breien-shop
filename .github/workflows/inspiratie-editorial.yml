name: Inspiratie editorial technical validation
on:
  push:
    branches: [main]
    paths:
      - 'inspiratie/**'
      - 'scripts/inspiratie/**'
      - '.content/briefs/inspiratie--**'
      - '.content/reviews/inspiratie--**'
      - '.github/workflows/inspiratie-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scoped Inspiratie HTML
        env:
          INSPIRATIE_PAGE: seizoenen
        run: python scripts/inspiratie/validate.py
