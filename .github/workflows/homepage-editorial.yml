name: Homepage editorial technical validation
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/homepage/**'
      - '.content/reviews/homepage--**'
      - '.github/workflows/homepage-editorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/homepage/validate.py
