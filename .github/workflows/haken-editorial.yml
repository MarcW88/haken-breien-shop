name: Haken editorial quality and visual checks
on:
  push:
    branches: [main]
    paths:
      - 'haken/**'
      - 'assets/style.css'
      - 'index.html'
      - 'scripts/haken/**'
      - '.github/workflows/haken-editorial.yml'
  pull_request:
    paths:
      - 'haken/**'
      - 'assets/style.css'
      - 'scripts/haken/**'
  workflow_dispatch:
    inputs:
      page:
        description: 'Single page slug (e.g. voor-beginners); blank = all Haken pages'
        required: false
        type: string
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate page routing, metadata, links, indexation and evidence gate
        env:
          HAKEN_PAGE: ${{ inputs.page }}
        run: python scripts/haken/validate.py
      - name: Upload machine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haken-editorial-audit
          path: .artifacts/haken/
          retention-days: 14
